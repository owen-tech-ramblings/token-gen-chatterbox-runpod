name: Publish Qwen3-TTS RunPod worker

on:
  push:
    branches:
      - agent/chatterbox-publication-voice
    paths:
      - .github/workflows/publish-qwen.yml
      - Dockerfile.qwen
      - qwen_handler.py
      - requirements-qwen.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - design
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: model
        shell: bash
        run: |
          if [[ "${{ matrix.variant }}" == "design" ]]; then
            echo "id=Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign" >> "$GITHUB_OUTPUT"
            echo "revision=5ecdb67327fd37bb2e042aab12ff7391903235d3" >> "$GITHUB_OUTPUT"
          else
            echo "id=Qwen/Qwen3-TTS-12Hz-1.7B-Base" >> "$GITHUB_OUTPUT"
            echo "revision=fd4b254389122332181a7c3db7f27e918eec64e3" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.qwen
          push: true
          tags: ghcr.io/owen-tech-ramblings/token-gen-chatterbox-runpod:qwen3-${{ matrix.variant }}-${{ github.sha }}
          build-args: |
            MODEL_VARIANT=${{ matrix.variant }}
            MODEL_ID=${{ steps.model.outputs.id }}
            MODEL_REVISION=${{ steps.model.outputs.revision }}
          cache-from: type=gha,scope=qwen3-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=qwen3-${{ matrix.variant }}
