name: Publish isolated TTS audition workers

on:
  push:
    branches:
      - agent/tts-model-auditions-20260801
    paths:
      - .github/workflows/publish-audition-models.yml
      - audition/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - fish
          - higgs
          - indextts2
          - zonos2
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim build disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: >-
          ${{ !contains(github.event.head_commit.message || '', '[higgs-only]') ||
              matrix.variant == 'higgs' }}
        with:
          context: .
          file: audition/Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/owen-tech-ramblings/token-gen-chatterbox-runpod:audition-${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=audition-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=audition-${{ matrix.variant }}
